<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Álbum privado · Eréndira & Enrique</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"><style>:root{--cream:#f7f3ea;--navy:#10294e;--gold:#b98b35;--white:#fffdf8;--sage:#7f9275}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:Montserrat,sans-serif}.page{max-width:1100px;margin:auto;padding:38px 22px 70px}.ey{letter-spacing:.28em;text-transform:uppercase;font-size:12px;color:var(--gold);font-weight:600;text-align:center}.title{font:400 clamp(52px,8vw,82px)/1 'Great Vibes',cursive;text-align:center;margin:8px 0 8px}.sub{font:23px/1.4 'Cormorant Garamond',serif;text-align:center;max-width:680px;margin:0 auto 28px}.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:24px auto 32px}.btn{border:0;border-radius:999px;background:var(--navy);color:#fff;padding:14px 24px;font:500 11px Montserrat;letter-spacing:.13em;text-transform:uppercase;cursor:pointer}.btn.alt{background:transparent;color:var(--navy);border:1px solid var(--gold)}.status{text-align:center;font:18px 'Cormorant Garamond';margin:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:var(--white);border:1px solid rgba(185,139,53,.38);padding:10px;box-shadow:0 10px 30px rgba(16,41,78,.05)}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#eee6d7}.meta{font:15px 'Cormorant Garamond';margin:9px 3px;color:#42516b}.actions{display:flex;gap:8px}.actions a{flex:1;text-align:center;text-decoration:none;padding:9px 8px;border-radius:999px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.open{border:1px solid var(--gold);color:var(--navy)}.download{background:var(--navy);color:#fff}.lock{max-width:430px;margin:40px auto;background:var(--white);padding:28px;border:1px solid rgba(185,139,53,.35);text-align:center}.lock input{width:100%;padding:13px;border:1px solid #d8c9aa;margin:12px 0;font-size:16px}.leaf{width:110px;margin:0 auto 12px;display:block}.leaf path{fill:none;stroke:var(--sage);stroke-width:1.3}.leaf ellipse{fill:rgba(127,146,117,.32);stroke:rgba(100,120,95,.5)}.leaf circle{fill:var(--gold)}.hidden{display:none!important}@media(max-width:600px){.page{padding-top:26px}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:7px}.title{font-size:55px}.sub{font-size:20px}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body><main class="page"><div class="ey">Acceso de los novios</div><h1 class="title">Nuestro álbum privado</h1><p class="sub">Aquí pueden revisar y descargar las fotografías que sus invitados compartan durante la boda.</p><section id="lock" class="lock"><div>Introduce la clave privada del álbum.</div><input id="key" type="password"><button class="btn" id="enter">Entrar</button><div class="status" id="lockStatus"></div></section><section id="album" class="hidden"><div class="bar"><button class="btn" id="refresh">Actualizar</button><button class="btn alt" id="downloadAll">Descargar todas (.zip)</button></div><div class="status" id="status">Cargando fotografías…</div><div class="grid" id="grid"></div></section></main><script>const API='https://sznsbwizgjtetjnkgfzv.supabase.co/functions/v1/wedding-album-admin';const hashKey=decodeURIComponent((location.hash.match(/key=([^&]+)/)||[])[1]||'');if(hashKey){sessionStorage.setItem('ee_album_key',hashKey);history.replaceState(null,'',location.pathname)}key.value=sessionStorage.getItem('ee_album_key')||'';let files=[];async function load(){const k=sessionStorage.getItem('ee_album_key');if(!k)return;status.textContent='Cargando fotografías…';try{const r=await fetch(API,{headers:{'x-album-key':k}});const j=await r.json();if(!r.ok)throw Error(j.error||'Acceso no autorizado');files=j.files||[];render();lock.classList.add('hidden');album.classList.remove('hidden')}catch(e){sessionStorage.removeItem('ee_album_key');album.classList.add('hidden');lock.classList.remove('hidden');lockStatus.textContent=e.message}}function render(){status.textContent=files.length?`${files.length} fotografía${files.length===1?'':'s'} en el álbum privado.`:'Todavía no hay fotografías.';grid.innerHTML=files.map((f,i)=>`<article class="card"><img loading="lazy" src="${f.url}"><div class="actions"><a class="open" target="_blank" href="${f.url}">Ver</a><a class="download" href="${f.url}" download="foto-${i+1}">Descargar</a></div></article>`).join('')}enter.onclick=()=>{sessionStorage.setItem('ee_album_key',key.value.trim());load()};refresh.onclick=load;downloadAll.onclick=async()=>{if(!files.length)return;const zip=new JSZip();for(let i=0;i<files.length;i++){const r=await fetch(files[i].url);zip.file(`boda-ee-${i+1}.jpg`,await r.blob())}const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fotos-boda-erendira-enrique.zip';a.click()};if(key.value)load();</script></body></html>
